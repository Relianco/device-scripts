name: Secret scan

# Delta scan with betterleaks 1.8.1, pinned by SHA256 the same way the
# website pins it. This job uses GitHub-hosted ubuntu-24.04. The policy is
# .betterleaks.toml. A pull request uses the copy on the base commit when
# that commit has one, so the pull request cannot weaken the rules. Until
# the base has the file, the job writes the same policy itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BETTERLEAKS_VERSION: "1.8.1"
      BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned betterleaks
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "${RUNNER_TEMP}/betterleaks.XXXXXX")"
          tgz="${tmp}/betterleaks.tar.gz"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "$url"
          echo "${BETTERLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" -C "$tmp" betterleaks
          got="$("$tmp/betterleaks" version 2>/dev/null | head -n1)"
          if [ "$got" != "${BETTERLEAKS_VERSION}" ]; then
            echo "::error::Installed betterleaks '${got}', expected ${BETTERLEAKS_VERSION}."
            exit 1
          fi
          echo "BETTERLEAKS_BIN=$tmp/betterleaks" >> "$GITHUB_ENV"

      - name: Resolve scan range
        id: range
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "$base"
            range="$(git merge-base "$base" HEAD)..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              range="HEAD"
            else
              range="${before}..${{ github.event.after }}"
            fi
          fi
          if ! git rev-list -n1 "$range" >/dev/null 2>&1 || [ -z "$(git rev-list -n1 "$range")" ]; then
            echo "::error::Resolved an empty scan range: '$range'."
            exit 1
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning range: $range"

      - name: Run betterleaks
        run: |
          set -euo pipefail
          policy="${RUNNER_TEMP}/policy.toml"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            trusted="${RUNNER_TEMP}/betterleaks-base.toml"
            if git show "${base}:.betterleaks.toml" > "$trusted" 2>/dev/null; then
              policy="$trusted"
              echo "Using .betterleaks.toml from the base commit."
            fi
          elif [ -f .betterleaks.toml ]; then
            policy=".betterleaks.toml"
            echo "Using .betterleaks.toml from this checkout."
          fi
          if [ "$policy" = "${RUNNER_TEMP}/policy.toml" ]; then
            echo "Writing the policy in this job. Keep it identical to .betterleaks.toml."
            cat > "$policy" <<'EOF'
          title = "device-scripts"
          [extend]
          useDefault = true

          [[allowlists]]
          description = "Teams download history used the fake userinfo password secret. Exact value only, and only in PowerShell tests."
          targetRules = ["generic-credential-uri"]
          condition = "AND"
          regexTarget = "secret"
          paths = ['''(^|/)tests/.*\.Tests\.ps1$''']
          regexes = ['''^secret$''']
          EOF
          fi
          status=0
          "$BETTERLEAKS_BIN" git . \
            -c "$policy" \
            --no-banner \
            --redact \
            --log-opts="${{ steps.range.outputs.range }}" \
            || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::betterleaks found a secret, or the scanner failed. Remove the secret and rewrite history if the commit was published."
            exit "$status"
          fi
          echo "No secrets found in range."
